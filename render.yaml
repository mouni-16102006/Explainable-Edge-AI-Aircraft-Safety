services:
  # Python FastAPI Backend Service
  - type: web
    name: aerosentinel-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        value: AEROSENTINEL_SUPER_SECRET_KEY_FOR_JWT_SECURITY_DO_NOT_LEAK
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120
